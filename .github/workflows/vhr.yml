name: VHR

# The PC is not always on, so the collecting happens here instead. Every run is
# a complete pass: scrape the card if the new one is up, fetch the results of
# every race that has run, rebuild the page.
on:
  schedule:
    - cron: "*/15 * * * *"     # GitHub delays scheduled runs under load; that is
                               # fine here - the card lasts all day and a result
                               # can still be fetched long after the race.
  workflow_dispatch:           # "Run workflow" button, for an immediate update

permissions:
  contents: write

# Two runs writing the branch at once would lose data. Queue them instead.
concurrency:
  group: vhr-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Colombo          # the 04:30 card rollover is in LK time
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Restore the store from the published branch
        run: |
          mkdir -p cloud-data
          git fetch --depth=1 origin gh-pages 2>/dev/null || true
          if git show origin/gh-pages:store/races.json > cloud-data/races.json 2>/dev/null; then
            echo "restored $(wc -c < cloud-data/races.json) bytes"
          else
            echo '{"races":{}}' > cloud-data/races.json
            echo "no previous store - starting fresh"
          fi

      - name: Collect and build
        run: python cloud_build.py --store cloud-data/races.json --out site

      - name: Publish
        run: |
          cd site
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="vhr-bot" -c user.email="vhr-bot@users.noreply.github.com" \
              commit -q -m "vhr $(date -u '+%Y-%m-%d %H:%M UTC')"
          # A single orphan commit each time, so the repo never grows a history
          # of 96 snapshots a day.
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
