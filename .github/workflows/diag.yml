name: DIAG
on: {workflow_dispatch: {}}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Where is this runner
        run: curl -s https://ipinfo.io/json || true
      - name: What does STBET say
        run: |
          echo "--- homepage ---"
          curl -s -o /dev/null -w "status=%{http_code}\n" https://www.stbet.com/
          echo "--- api ---"
          curl -s -D /tmp/h.txt -o /tmp/b.txt -w "status=%{http_code} bytes=%{size_download}\n" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/146.0.0.0 Safari/537.36" \
            -H "Accept: application/json" -H "Referer: https://www.stbet.com/" \
            "https://www.stbet.com/stbetrest/services/online/meeting/activeMeetings?country=VR&date=31%2F32%2F2026+11%3A32%3A38&filter=2&inplay=false&sport=HR"
          echo "--- response headers ---"; cat /tmp/h.txt
          echo "--- body (first 800 chars) ---"; head -c 800 /tmp/b.txt; echo
